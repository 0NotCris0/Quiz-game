<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Arena</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <header class="cabecera-arena">
      <span class="alas" aria-hidden="true"></span>
      <p>Quiz Arena</p>
      <span class="alas alas-derecha" aria-hidden="true"></span>
    </header>

    <section id="pantalla-inicio" class="pantalla">
      <p class="etiqueta-pantalla">01 · Inicio</p>
      <div class="icono-arena" aria-hidden="true">🎮</div>
      <h1>Quiz<br>Arena</h1>

      <label for="nombre-jugador">Nombre del jugador</label>
      <input type="text" id="nombre-jugador" placeholder="Escribe tu nombre">

      <label for="tipo-quiz">Tipo de quiz</label>
      <select id="tipo-quiz">
        <option value="Tipo 1">Tipo 1</option>
        <option value="Tipo 2">Tipo 2</option>
      </select>

      <button type="button" id="btn-empezar">Empezar</button>
    </section>

    <section id="pantalla-juego" class="pantalla oculto">
      <p class="etiqueta-pantalla">02 · Juego</p>

      <div class="info-juego">
        <p id="progreso">Pregunta 1 de 5</p>
        <p>Puntos: <span id="puntuacion">0</span></p>
        <p>Tiempo: <span id="temporizador">15</span></p>
      </div>

      <h2 id="pregunta">Pregunta de ejemplo</h2>

      <div id="opciones">
        <button type="button" id="opcion-0" class="opcion">Opción 1</button>
        <button type="button" id="opcion-1" class="opcion">Opción 2</button>
        <button type="button" id="opcion-2" class="opcion">Opción 3</button>
        <button type="button" id="opcion-3" class="opcion">Opción 4</button>
      </div>

      <button type="button" id="btn-siguiente">Siguiente</button>
    </section>

    <section id="pantalla-resultados" class="pantalla oculto">
      <p class="etiqueta-pantalla">03 · Resultados</p>
      <div class="icono-arena" aria-hidden="true">🏆</div>
      <h2>¡Partida completada!</h2>
      <p>Jugador: <span id="resultado-nombre"></span></p>

      <div class="marcador-final">
        <p class="puntuacion-final">
          <span id="resultado-puntuacion">0</span>
          Puntuación final
        </p>
        <p>Aciertos: <span id="resultado-aciertos">0</span></p>
        <p>Fallos: <span id="resultado-fallos">0</span></p>
      </div>

      <button type="button" id="btn-reiniciar">Reiniciar</button>
    </section>

    <footer class="pie-arena">
      Deportes <span aria-hidden="true">◆</span> Videojuegos
    </footer>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
