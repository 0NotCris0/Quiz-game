<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <!-- Estilos: los define Adria en css/style.css -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>

    <!-- PANTALLA 1: INICIO (visible al cargar la página) -->
    <section id="pantalla-inicio" class="pantalla">
      <h1>Quiz</h1>

      <label for="nombre-jugador">Nombre del jugador</label>
      <input type="text" id="nombre-jugador" placeholder="Escribe tu nombre">

      <label for="tipo-quiz">Categoría de quiz</label>
      <select id="tipo-quiz">
        <!-- El value debe ser IGUAL que la clave de bancosDePreguntas en js/acceso.js -->
        <option value="Videojuegos">Videojuegos</option>
        <option value="Deportes">Deportes</option>
      </select>

      <button id="btn-empezar">Empezar</button>
    </section>

    <!-- PANTALLA 2: JUEGO (oculta al cargar; se muestra desde JavaScript) -->
    <section id="pantalla-juego" class="pantalla oculto">
      <div class="info-juego">
        <p id="progreso">Pregunta 1 de 15</p>
        <p>Puntos: <span id="puntuacion">0</span></p>
        <p>Tiempo: <span id="temporizador">15</span></p>
      </div>

      <h2 id="pregunta">Pregunta de ejemplo</h2>

      <div id="opciones">
        <button id="opcion-0" class="opcion">Opción 1</button>
        <button id="opcion-1" class="opcion">Opción 2</button>
        <button id="opcion-2" class="opcion">Opción 3</button>
        <button id="opcion-3" class="opcion">Opción 4</button>
      </div>

      <button id="btn-siguiente">Siguiente</button>
    </section>

    <!-- PANTALLA 3: RESULTADOS (oculta al cargar; se muestra al terminar) -->
    <section id="pantalla-resultados" class="pantalla oculto">
      <h2>Resultados</h2>
      <p>Jugador: <span id="resultado-nombre"></span></p>
      <p>Puntuación final: <span id="resultado-puntuacion">0</span></p>
      <p>Aciertos: <span id="resultado-aciertos">0</span></p>
      <p>Fallos: <span id="resultado-fallos">0</span></p>

      <button id="btn-reiniciar">Reiniciar</button>
    </section>

  </main>

  <!-- Preguntas de cada categoría: las prepara Christian en js/preguntas.js -->
  <script src="js/preguntas.js"></script>
  <!-- Lógica del juego: la escribe Joan en js/script.js -->
  <script src="js/script.js"></script>
  <!-- Pantalla de inicio (nombre y categoría): la escribe Albert en js/acceso.js -->
  <script src="js/acceso.js"></script>
</body>
</html>
